project: crux
id: crux
updated: "20260419::142500"
description: >
  An agentic DSL for Rust — inspectable, serializable, replayable agent execution.
  Rust-embedded DSL (macros, traits, types) for writing agentic programs where every
  step, branch, delegation, and failure is a first-class value.

items:
  - id: crux-25
    name: minibox-agent-adapter
    title: "minibox-agent: FallbackChainAdapter implementing crux LlmProvider"
    description: >
      Wire minibox-llm's FallbackChain into crux-agentic's LlmProvider port.
      FallbackChainAdapter newtype, CruxLlmStep newtype over LlmStep<FallbackChainAdapter>,
      re-export crux-agentic surface from minibox-agent.
    priority: P1
    status: open
    files:
      - crates/minibox-agent/src/provider.rs
      - crates/minibox-agent/src/step.rs
      - crates/minibox-agent/src/lib.rs
      - crates/minibox-agent/Cargo.toml

  - id: crux-26
    name: planner-implementation
    title: "Implement crux-planner: goal-to-pipeline generation"
    description: >
      Implement the planner designed in docs/planner-design.md. Start with the
