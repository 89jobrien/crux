<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 364.453px; background-color: transparent;" viewBox="4 4 364.453125 1346.5" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:IBM Plex Sans,Helvetica,sans-serif;font-size:15px;fill:#e8e6e1;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#0b0d11;}#my-svg .error-text{fill:#f4f2ee;stroke:#f4f2ee;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#8a8a85;stroke:#8a8a85;}#my-svg .marker.cross{stroke:#8a8a85;}#my-svg svg{font-family:IBM Plex Sans,Helvetica,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .label{font-family:IBM Plex Sans,Helvetica,sans-serif;color:#e8e6e1;}#my-svg .cluster-label text{fill:#f4f2ee;}#my-svg .cluster-label span{color:#f4f2ee;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#e8e6e1;color:#e8e6e1;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#171a22;stroke:#33363f;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .lab