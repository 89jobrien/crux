pipeline: extract_entities
# Extract named entities from text via BAML and emit structured JSON output.
#
# Pipeline input (pass as input.json to crux-run):
#   {
#     "function": "ExtractEntities",
#     "input": { "text": "<text to analyze>" }
#   }
#
# Environment — set one of:
#   ANTHROPIC_API_KEY   (BAML uses Claude by default)
#   OPENAI_API_KEY      (configure client override in BAML client config)
#
# Run:
#   crux-run examples/extract_entities.yaml examples/input_entities.json
budget: { calls: 2 }

steps:
  - step: extract
    handler: llm::extract
    # Input shape: { function: "ExtractEntities", input: { text: "..." } }
    # Output:      { entities: [{ name, entity_type, description }, ...] }

  - step: log_output
    handler: ctrl::log
    # Logs the entity list to stderr and passes it through as the pipeline
    # output. Capture the final JSON from crux-run's "Output:" section.
    #
    # To write directly to a file, replace ctrl::log with fs::write and
    # supply `content` (a JSON-serialized string) in the pipeline input.
