pipeline: deep_research
budget: { tokens: 50000 }

steps:
  - step: decompose_query
    handler: query_planner

  - join_all: gather_sources
    arms:
      - arxiv_search
      - web_search
      - local_knowledge_base
      - citation_graph_walk

  - pipe: refine
    stages:
      - deduplicate
      - rank_by_relevance
      - extract_claims
      - cross_reference

  - speculate: synthesis
    mode: pick_best
    arms:
      - narrative_synthesis
      - structured_synthesis
      - comparative_synthesis

  - step: fact_check
    handler: claim_verifier

  - route_on_confidence: output_decision
    value: "{{ steps.fact_check.confidence }}"
    routes:
      - range: "[0.0, 0.5)"
        label: unreliable
        handler: flag_for_human_review
      - range: "[0.5, 0.8)"
        label: partial
        handler: annotate_uncertainty
      - range: "[0.8, 1.0]"
        label: confident
        handler: publish_report
