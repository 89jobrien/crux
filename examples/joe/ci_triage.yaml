pipeline: ci_triage
# Triage a failed CI run across a Rust workspace. Fan out to all failure
# categories in parallel, rank by severity, then route to the right action.
budget: { calls: 12 }

steps:
  - step: fetch_run
    handler: shell::capture
    args:
      cmd: "gh run view --log-failed"
    # Pulls the failed workflow run logs via `gh run view --log-failed`

  - join_all: diagnose
    arms:
      - step: compile_errors
        handler: ci::compile_errors
        # rustc E-codes, missing impls, type mismatches
      - step: clippy_violations
        handler: ci::clippy_violations
        # `-D warnings` hits -- lint category + file:line
      - step: nextest_failures
        handler: ci::nextest_failures
        # cargo nextest JSON output -- test name + panic msg
      - step: deny_violations
        handler: ci::deny_violations
        # cargo-deny: banned crates, license conflicts, advisories

  - pipe: rank
    stages:
      - step: deduplicate_spans
        handler: ci::deduplicate_spans
        # collapse rustc errors sharing the same root cause
      - step: classify_severity
        handler: ci::classify_severity
        # compile > deny > test > clippy
      - step: attach_owners
        handler: ci::attach_owners
        # map file paths to crate names in workspace
      - step: score_fixability
        handler: ci::score_fixability
        # heuristic: is there an obvious one-line fix?

  # Classify ranked diagnostics into a confidence score.
  - step: confidence_from_rank
    handler: llm::extract
    args:
      input: "{{ steps.rank.output }}"
      function: Classify

  - route_on_confidence: action
    value: "{{ steps.confidence_from_rank.confidence }}"
    routes:
      - range: "[0.0, 0.4)"
        label: unclear
        handler: ctrl::log
        # confidence too low -- open a doob task with raw diagnostics attached
      - range: "[0.4, 0.75)"
        label: actionable
        handler: shell::capture
        args:
          cmd: "doob todo add --priority high"
        # `doob todo add --priority high --repo <crate> "<ranked summary>"`
      - range: "[0.75, 1.0]"
        label: auto_fixable
        handler: shell::capture
        args:
          cmd: "cargo fix --allow-dirty && cargo nextest run"
        # fmt fix or trivial clippy allow -- commit, re-trigger CI
