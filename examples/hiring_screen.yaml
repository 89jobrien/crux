pipeline: candidate_screen
budget: { tokens: 8000 }

steps:
  - step: parse_resume
    handler: resume_parser

  - join_all: evaluate
    arms:
      - skill_matcher
      - experience_scorer
      - culture_signal_extractor
      - red_flag_detector

  - pipe: rank
    stages:
      - weight_signals
      - normalize_scores
      - apply_role_criteria

  - route_on_confidence: decision
    value: "{{ steps.rank.confidence }}"
    routes:
      - range: "[0.0, 0.3)"
        label: pass
        handler: archive_candidate
      - range: "[0.3, 0.7)"
        label: maybe
        handler: flag_for_recruiter
      - range: "[0.7, 1.0]"
        label: strong
        handler: schedule_interview
