pipeline: trade_signal
budget: { duration_ms: 500 }

steps:
  - join_all: market_data
    arms:
      - orderbook_snapshot
      - recent_trades
      - funding_rate
      - open_interest

  - speculate: models
    mode: pick_best
    arms:
      - momentum_model
      - mean_reversion_model
      - ml_ensemble

  - pipe: risk_check
    stages:
      - position_size_limit
      - drawdown_guard
      - correlation_filter

  - route_on_confidence: execute
    value: "{{ steps.risk_check.confidence }}"
    routes:
      - range: "[0.0, 0.5)"
        label: no_trade
        handler: log_skip
      - range: "[0.5, 0.8)"
        label: small
        handler: submit_quarter_size
      - range: "[0.8, 1.0]"
        label: full
        handler: submit_full_size
