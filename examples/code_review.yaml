pipeline: code_review
budget: { tokens: 10000 }

steps:
  - step: parse_diff
    handler: diff_parser

  - join_all: analyze
    arms:
      - security_scan
      - style_check
      - complexity_analysis
      - test_coverage_check

  - step: synthesize
    handler: review_synthesizer

  - route_on_confidence: triage
    value: "{{ steps.synthesize.confidence }}"
    routes:
      - range: "[0.0, 0.3)"
        label: critical
        handler: block_merge
      - range: "[0.3, 0.7)"
        label: needs_work
        handler: request_changes
      - range: "[0.7, 1.0]"
        label: clean
        handler: auto_approve
