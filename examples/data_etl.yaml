pipeline: etl_ingest
budget: { duration_ms: 30000 }

steps:
  - join_all: extract
    arms:
      - postgres_source
      - s3_parquet_source
      - api_polling_source

  - pipe: transform
    stages:
      - schema_validate
      - normalize_timestamps
      - deduplicate_records
      - enrich_geocoding
      - compute_aggregates

  - speculate: load_strategy
    mode: first_ok
    arms:
      - batch_insert
      - streaming_upsert
      - copy_from_stdin
