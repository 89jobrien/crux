[package]
name = "crux-agentic"
description = "Built-in step handlers for crux-script pipelines"
version.workspace = true
edition.workspace = true
readme = "../../README.md"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
baml = ["dep:crux-baml"]
docker = ["dep:bollard", "dep:futures"]

[dependencies]
crux-runtime = { path = "../crux-runtime", version = "0.3.0" }
crux-model = { path = "../crux-model", version = "0.3.0" }
crux-script = { path = "../crux-script", version = "0.3.0" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
glob = "0.3"
ignore = "0.4"
clap = { workspace = true }
crux-baml = { path = "../crux-baml", version = "0.3.0", optional = true }
bollard = { version = "0.20", optional = true }
futures = { workspace = true, optional = true }
crux-plugin = { path = "../crux-plugin", version = "0.3.0" }
crux-stdlib = { path = "../crux-stdlib", version = "0.3.0" }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "crux"
path = "src/bin/crux/main.rs"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
crux-baml = { path = "../crux-baml", version = "0.3.0" }
