[package]
name = "crux-agentic"
description = "Built-in step handlers for crux-script pipelines"
version.workspace = true
edition.workspace = true
readme = "../../README.md"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
baml = ["dep:crux-baml"]
docker = ["dep:bollard", "dep:futures"]

[dependencies]
bollard = { version = "0.20", optional = true }
chrono = { workspace = true }
clap = { workspace = true }
crux-baml = { workspace = true, optional = true } #unified
crux-model = { workspace = true } #unified
crux-plugin = { workspace = true } #unified
crux-runtime = { workspace = true } #unified
crux-script = { workspace = true } #unified
crux-stdlib = { workspace = true } #unified
futures = { workspace = true, optional = true }
glob = { workspace = true } #unified
ignore = "0.4"
reqwest = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "crux"
path = "src/bin/crux/main.rs"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
