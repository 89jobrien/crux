[package]
name = "cruxx-agentic"
description = "Built-in step handlers for cruxx-script pipelines"
version = "0.2.5"
edition.workspace = true
readme = "../../README.md"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
baml = ["dep:baml"]
docker = ["dep:bollard", "dep:futures"]

[dependencies]
cruxx-core = { path = "../cruxx-core", version = "0.2.5" }
cruxx-model = { path = "../cruxx-model", version = "0.2.5" }
cruxx-script = { path = "../cruxx-script", version = "0.2.5" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
glob = "0.3"
clap = { workspace = true }
baml = { version = "0.221.0", optional = true }
bollard = { version = "0.20", optional = true }
futures = { workspace = true, optional = true }
cruxx-plugin = { path = "../cruxx-plugin", version = "0.2.5" }

[[bin]]
name = "crux"
path = "src/bin/cruxx.rs"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
