[package]
name = "cruxx"
description = "An agentic DSL for Rust — inspectable, serializable, replayable agent execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
cruxx-core = { path = "../cruxx-core", version = "0.2.5" }
cruxx-macros = { path = "../cruxx-macros", version = "0.2.5" }
cruxx-domain = { path = "../cruxx-domain", version = "0.2.5" }
cruxx-script = { path = "../cruxx-script", version = "0.2.5", optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
cruxx-agentic = { path = "../cruxx-agentic", version = "0.2.5" }
cruxx-domain = { path = "../cruxx-domain", version = "0.2.5", features = ["tokio-pipeline"] }

[features]
default = ["tokio-runtime"]
tokio-runtime = ["cruxx-core/tokio-runtime"]
redb = ["cruxx-core/redb"]
tracing = ["cruxx-core/tracing"]
script = ["dep:cruxx-script"]
