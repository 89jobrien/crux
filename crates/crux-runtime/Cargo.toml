[package]
name = "crux-runtime"
description = "Core types, traits, and runtime for the crux agentic DSL"
version.workspace = true
edition.workspace = true
readme = "../../README.md"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# Always required — Step.output is Option<Value>, children are type-erased
chrono = { workspace = true }
crux-domain = { workspace = true, features = ["tokio-pipeline"] } #unified
crux-types = { workspace = true, features = ["miette"] } #unified
futures = { workspace = true, optional = true }
miette = { workspace = true }
redb = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
slashcrux = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }

# Optional
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
crux-types = { workspace = true, features = ["test-utils"] } #unified
futures = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }

[features]
default = ["tokio-runtime"]
tokio-runtime = ["dep:tokio", "dep:futures"]
redb = ["dep:redb", "dep:tempfile"]
tracing = ["dep:tracing"]
