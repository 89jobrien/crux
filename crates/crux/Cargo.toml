[package]
name = "crux"
description = "An agentic DSL for Rust — inspectable, serializable, replayable agent execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "crux"

[dependencies]
crux-domain = { workspace = true } #unified
crux-derive = { workspace = true } #unified
crux-runtime = { workspace = true } #unified
crux-script = { workspace = true, optional = true } #unified

[dev-dependencies]
crux-agentic = { workspace = true } #unified
crux-domain = { workspace = true, features = ["tokio-pipeline"] } #unified
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = ["tokio-runtime"]
tokio-runtime = ["crux-runtime/tokio-runtime"]
redb = ["crux-runtime/redb"]
tracing = ["crux-runtime/tracing"]
script = ["dep:crux-script"]
