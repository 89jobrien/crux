[package]
name = "crux"
description = "An agentic DSL for Rust — inspectable, serializable, replayable agent execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
crux-core = { path = "../crux-core", version = "0.1.0" }
crux-macros = { path = "../crux-macros", version = "0.1.0" }
crux-script = { path = "../crux-script", version = "0.1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }

[features]
default = ["tokio-runtime"]
tokio-runtime = ["crux-core/tokio-runtime"]
redb = ["crux-core/redb"]
tracing = ["crux-core/tracing"]
script = ["dep:crux-script"]
