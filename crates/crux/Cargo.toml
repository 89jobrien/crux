[package]
name = "cruxai"
description = "An agentic DSL for Rust — inspectable, serializable, replayable agent execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
cruxai-core = { path = "../crux-core", version = "0.2.4" }
cruxai-macros = { path = "../crux-macros", version = "0.2.4" }
cruxai-script = { path = "../crux-script", version = "0.2.4", optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
crux-agentic = { path = "../crux-agentic", version = "0.2.4" }

[features]
default = ["tokio-runtime"]
tokio-runtime = ["cruxai-core/tokio-runtime"]
redb = ["cruxai-core/redb"]
tracing = ["cruxai-core/tracing"]
script = ["dep:cruxai-script"]
