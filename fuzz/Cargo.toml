[workspace]

[package]
name = "cruxx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies.cruxx-agentic]
path = "../crates/cruxx-agentic"

[dependencies.cruxx-script]
path = "../crates/cruxx-script"

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sqlite_args"
path = "fuzz_targets/sqlite_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_parse_vimgrep"
path = "fuzz_targets/text_parse_vimgrep.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_parse_jsonl"
path = "fuzz_targets/text_parse_jsonl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_parse_frontmatter"
path = "fuzz_targets/text_parse_frontmatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_parse_diff"
path = "fuzz_targets/text_parse_diff.rs"
test = false
doc = false
bench = false
