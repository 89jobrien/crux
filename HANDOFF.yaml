project: crux
id: crux
updated: "2026-04-12"
description: >
  An agentic DSL for Rust — inspectable, serializable, replayable agent execution.
  Rust-embedded DSL (macros, traits, types) for writing agentic programs where every
  step, branch, delegation, and failure is a first-class value.

items:
