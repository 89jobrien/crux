    description: >
      Add hook stack (on_low_confidence, on_step_failure, on_budget_exceeded),
      Recovery dispatch inside step(), replay engine with input hash matching,
      strict/lenient modes.
    priority: P0
    status: done
    completed: 2026-04-11
    files:
