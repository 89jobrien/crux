  - id: crux-9
    name: route-on-confidence
    title: "route_on_confidence, pipe operator, join_all"
    description: >
      ConfidenceRange with exclusive/inclusive constructors. route_on_confidence
      validates non-overlapping, gap-free, [0.0,1.0]-covering ranges. pipe chains
      sequential closures with per-stage step recording. join_all fans out via
      futures::join_all with per-arm step recording.
    priority: P2
    status: done
    completed: 2026-04-11
    files:
      - crates/crux-core/src/ctx.rs

  - id: crux-10
    name: redb-migration
    title: "Replace rusqlite with redb (pure-Rust embedded KV)"
    description: >
      Swap sqlite feature (rusqlite, C deps) for redb feature (pure-Rust).
      RedbBackend with typed TableDefinition<&str, &[u8]>, ACID transactions,
      CAS via read-modify-write in single write txn.
    priority: P1
    status: done
    completed: 2026-04-12
    files:
      - crates/crux-core/src/registry/redb.rs
      - crates/crux-core/src/registry/mod.rs
      - crates/crux-core/Cargo.toml
      - crates/crux/Cargo.toml
      - Cargo.toml

  - id: crux-11
    name: join-all-hooks
    title: "Normalize join_all budget check and failure hooks"
    description: >
      Add budget check before dispatching arms (mirrors step_with_confidence).
      Consult on_step_failure hook for failed arms post-collection (mirrors
      execute_single). Hooks run post-collection due to borrow checker constraint.
    priority: P1
    status: done
    completed: 2026-04-12
    files:
      - crates/crux-core/src/ctx.rs

  - id: crux-12
    name: lenient-replay-identity
    title: "Tighten ReplayMode::Lenient identity checks in forward scans"
    description: >
      Added content_hash (optional, ordinal-independent) to Step and ReplayEntry.
      Forward scan uses content_hash when both sides provide one, filtering out
      false-positive hits from name collisions. New step_keyed() method on Context
      trait lets callers opt in by providing a serializable key. hash_content()
      utility exported in prelude.
    priority: P1
    status: done
    completed: 2026-04-12
    files:
      - crates/crux-core/src/replay.rs
      - crates/crux-core/src/recorder.rs
      - crates/crux-core/src/context.rs
      - crates/crux-core/src/ctx.rs
      - crates/crux-core/src/types/step.rs

