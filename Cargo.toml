[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
authors = ["Joseph O'Brien"]
repository = "https://github.com/89jobrien/crux"
homepage = "https://github.com/89jobrien/crux"
readme = "README.md"
keywords = ["agent", "agentic", "dsl", "replay", "trace"]
categories = ["development-tools", "asynchronous"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
crux-agentic = { path = "crates/crux-agentic", version = "0.3.1" }
crux-baml = { path = "crates/crux-baml", version = "0.3.1" }

# Internal crates
crux-domain = { path = "crates/crux-domain", version = "0.3.1" }
crux-improve = { path = "crates/crux-improve", version = "0.3.1" }
crux-macros = { path = "crates/crux-macros", version = "0.3.1" }
crux-model = { path = "crates/crux-model", version = "0.3.1" }
crux-planner = { path = "crates/crux-planner", version = "0.3.1" }
crux-plugin = { path = "crates/crux-plugin", version = "0.3.1" }
crux-runtime = { path = "crates/crux-runtime", version = "0.3.1" }
crux-script = { path = "crates/crux-script", version = "0.3.1" }
crux-stdlib = { path = "crates/crux-stdlib", version = "0.3.1" }
crux-task = { path = "crates/crux-task", version = "0.3.1" }
crux-types = { path = "crates/crux-types", version = "0.3.1" }

# Directories
dirs = "6"
futures = "0.3"

# File patterns
glob = "0.3"

# Diagnostics
miette = { version = "7", features = ["fancy"] }
proc-macro2 = "1"
proptest = "1.11.0"
quote = "1"

# Storage
redb = "4"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# Core
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.23"
serde_json = "1"
serde_yaml = "0.9"

# Shared vocabulary
slashcrux = "0.1.1"

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }

# Temp files
tempfile = "3"
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }

# Testing
tokio-test = "0.4"

# TOML parsing
toml = "0.8"

# Observability
tracing = "0.1"

# IDs
ulid = { version = "1", features = ["serde"] }
