[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Joseph O'Brien"]
repository = "https://github.com/89jobrien/crux"
homepage = "https://github.com/89jobrien/crux"
readme = "README.md"
keywords = ["agent", "agentic", "dsl", "replay", "trace"]
categories = ["development-tools", "asynchronous"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.23"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# IDs
ulid = { version = "1", features = ["serde"] }

# Proc macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Storage
redb = "4"

# Observability
tracing = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Temp files
tempfile = "3"

# Shared vocabulary
slashcrux = "0.1.1"

# Testing
tokio-test = "0.4"
proptest = "1.11.0"
