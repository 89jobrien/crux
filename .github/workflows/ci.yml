name: CI

on:
  push:
    branches: [main, "feature/*", "chore/*", "fix/*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  compile-check:
    name: compile + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: stub generated modules for fmt
        run: |
          for crate in crux-agentic crux-baml; do
            mkdir -p "crates/$crate/src/baml_client"
            printf '\n' > "crates/$crate/src/baml_client/mod.rs"
          done
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --exclude crux-baml --exclude crux-agentic --all-targets -- -D warnings
      - name: cargo clippy (crux-agentic, lib only)
        run: cargo clippy -p crux-agentic --lib -- -D warnings
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --exclude crux-baml --exclude crux-agentic --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest run
        run: cargo nextest run --workspace --exclude crux-baml

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
