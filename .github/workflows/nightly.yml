name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - name: install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace --exclude crux-baml --exclude crux-agentic --all-targets

  regression:
    name: regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: stub generated modules for fmt
        run: |
          for crate in crux-agentic crux-baml; do
            mkdir -p "crates/$crate/src/baml_client"
            printf '\n' > "crates/$crate/src/baml_client/mod.rs"
          done
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --exclude crux-baml --exclude crux-agentic --all-targets -- -D warnings
      - name: cargo nextest run
        run: cargo nextest run --workspace --exclude crux-baml --exclude crux-agentic

  nightly-release:
    name: nightly release
    runs-on: ubuntu-latest
    needs: [audit, machete, msrv, regression]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set nightly tag
        id: tag
        run: echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "Nightly $TAG" \
            --notes "Automated nightly release from main. All regression tests passed." \
            --prerelease
